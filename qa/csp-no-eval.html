<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- CSP without 'unsafe-eval'. Must be the first element so it applies to the snippet below.
     eval() and new Function() are blocked on this page; inline scripts, styles and the Optimizely
     cross-domain iframe stay allowed, so the only difference from the other pages is eval.
     The develrc snippet is served from the staging bucket, so that host is allowed for scripts,
     frames and connections. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://optimizely-staging.s3.amazonaws.com https://cdn.optimizely.com; connect-src 'self' https://*.optimizely.com https://optimizely-staging.s3.amazonaws.com; frame-src https://*.optimizely.com https://optimizely-staging.s3.amazonaws.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSP without unsafe-eval | Mini Shop QA (develrc)</title>
<link rel="icon" href="data:,">
<!-- OPTIMIZELY SNIPPET: synchronous, same project as the rest of the site (develrc project 5185974816735232). -->
<script src="https://optimizely-staging.s3.amazonaws.com/js/5185974816735232.js"></script>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="csp">
<main class="container" style="padding:32px 0">
  <h1 data-qa="csp-title">CSP page without unsafe-eval</h1>
  <p data-qa="csp-eval-status">eval check: pending</p>
  <p class="lead" data-qa="csp-note">This page sends a Content-Security-Policy that does not allow unsafe-eval. Use it to compare how audience Custom JavaScript conditions behave when eval is blocked.</p>
  <p><a id="site-logo" href="../index.html">Back to the shop</a></p>
</main>
<script>
/* Self-check: shows whether the page really blocks eval. */
(function () {
  var el = document.querySelector('[data-qa="csp-eval-status"]');
  try { (0, eval)('1'); el.textContent = 'eval check: allowed'; }
  catch (e) { el.textContent = 'eval check: blocked'; }
})();
</script>
</body>
</html>
